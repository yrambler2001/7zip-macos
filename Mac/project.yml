# XcodeGen spec for the macOS 7-Zip port. Regenerate with:  xcodegen -s Mac/project.yml
# Rules and gotchas: ai/04-toolchain.md section 5, ai/architecture.md.
# Source paths must stay relative (../C, ../CPP, ../Asm); absolute or deep paths hang XcodeGen.
name: 7-Zip
options:
  bundleIdPrefix: com.yrambler2001
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
# pub3: the version of every target comes from Mac/VERSION through this xcconfig
# (MARKETING_VERSION = PORT_VERSION, CURRENT_PROJECT_VERSION = the build number).
configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: NO
    # pub3: universal (Apple Silicon + Intel). Release builds both slices; Debug builds the
    # destination's architecture only (arm64 natively, x86_64 for a Rosetta test run).
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: YES
    CLANG_CXX_LIBRARY: libc++
    GCC_C_LANGUAGE_STANDARD: gnu17
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: NO
    SKIP_INSTALL: YES
  configs:
    Debug:
      GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "DEBUG=1"]
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
    Release:
      # packaging scope. Xcode injects com.apple.security.get-task-allow into every signature
      # unless this is NO, and Apple's notary service *rejects* a submission whose executables
      # carry it ("The executable requests the com.apple.security.get-task-allow entitlement").
      # A Release build is the one we ship, so it must not ask to be debuggable. Measured before
      # the change: all four binaries in the Release bundle carried the key.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      ONLY_ACTIVE_ARCH: NO
# -----------------------------------------------------------------------------
# fastui scope: a test-only copy of the app. Same sources and resources as the
# 7-Zip target, minus the three app extensions (a test never loads them, and
# every build registers another copy with pluginkit), and with a bundle
# identifier of its own.
#
# Why the copies exist: `XCUIApplication.launch()` attaches to an instance that
# is already running instead of replacing it, and `terminate()` kills every
# process with that bundle id -- so two XCUITest bundles that share an
# identifier fail each other's tests, and the app-hosted unit tests would be
# killed by the input shard's first launch. One app target per shard is what
# `ai/test-support-contract.md` ("Running several instances at once")
# asks the app to tolerate, expressed in the build.
# -----------------------------------------------------------------------------
targetTemplates:
  SevenZipTestApp:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
      - path: Resources/Assets.xcassets
      - path: Resources/Icons
        buildPhase: resources
      - path: Resources/SFX
        type: folder
        buildPhase: resources
      # opsgaps: the HTML help unpacked from 7-zip.chm by fetch-assets.sh, kept as a folder
      # so Contents/Resources/Help/<kHelpTopic> resolves (01 section 9 #17).
      - path: Resources/Help
        type: folder
        buildPhase: resources
    dependencies:
      - target: SevenZipKit
        embed: true
    settings:
      base:
        PRODUCT_NAME: ${productName}
        # A module name of its own: every app target installs its `.swiftmodule` into the shared
        # products directory, so four targets called SevenZipApp are four commands writing
        # Products/Debug/SevenZipApp.swiftmodule -- "Multiple commands produce ...", measured.
        # `SevenZipAppTests` imports the host's name (`@testable import SevenZipAppHost`).
        PRODUCT_MODULE_NAME: ${moduleName}
        PRODUCT_BUNDLE_IDENTIFIER: ${bundleId}
        # NOT App/Info.plist: a copy that claims the sevenzip:// scheme, the 40 archive document
        # types or the five Services is a copy Launch Services can route a real URL to. It happened
        # -- with the probes registered, `NSWorkspace.open(sevenzip://…)` from another scope's tests
        # was answered by a probe, which then stole the frontmost menu bar and failed eleven of their
        # tests. Mac/Tests/AppVariants/Info.plist is App/Info.plist with those four keys removed.
        INFOPLIST_FILE: Tests/AppVariants/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES

  # One XCUITest shard. `SEVENZIP_APP_*` reach the test bundle through its
  # Info.plist, which is how `TestShard` (Mac/Tests/UIDriver/TestSupport.swift)
  # knows which instance to drive and where to send a reset URL -- one
  # `.xctestrun` can then run every shard without per-shard environment.
  SevenZipUIShard:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UIDriver
      - path: ${casesPath}
        excludes:
          - "Info.plist"
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: ${appTarget}
    settings:
      base:
        PRODUCT_NAME: ${productName}
        PRODUCT_MODULE_NAME: ${moduleName}
        PRODUCT_BUNDLE_IDENTIFIER: ${bundleId}
        INFOPLIST_FILE: ${casesPath}/Info.plist
        TEST_TARGET_NAME: ${appTarget}
        SEVENZIP_APP_NAME: ${appTarget}
        SEVENZIP_APP_BUNDLE_ID: ${appBundleId}
        SEVENZIP_SHARD_NAME: ${shardName}
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        # No entitlements file: Xcode signs the generated *-Runner.app with its own
        # (app-sandboxed) entitlements and ignores CODE_SIGN_ENTITLEMENTS here -- verified, see
        # ai/reports/harness.md section 1.
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]

targets:

  # ---------------------------------------------------------------------------
  # SevenZipCore: the unchanged 7-Zip engine (7zz source set minus the console
  # files) + patched UI/Agent + portable UI/Common/FileManager helpers + the
  # macOS platform layer (Mac/Core/Platform). See 02-engine-api.md sections 1
  # and 4. Compiled with the 7zz defines; no -Weverything -Werror on upstream
  # code. Mac/Core/Platform sources are compiled with -Wall -Wextra -Werror.
  # ---------------------------------------------------------------------------
  SevenZipCore:
    type: library.static
    platform: macOS
    settings:
      base:
        PRODUCT_NAME: SevenZipCore
        CLANG_CXX_LANGUAGE_STANDARD: c++11
        # pub3: plain textual includes, as upstream's makefiles compile. With clang modules on, the
        # x86_64 slice fails in C/AesOpt.c: <wmmintrin.h> is a submodule of _Builtin_intrinsics that
        # does not make <emmintrin.h>'s __m128i visible ("missing '#include <emmintrin.h>'").
        CLANG_ENABLE_MODULES: NO
        GCC_OPTIMIZATION_LEVEL: 2
        # SZ_LZMA_DEC_OPT_DEFS: Z7_LZMA_DEC_OPT on arm64 only, where Asm/arm64/LzmaDecOpt.S
        # provides LzmaDec_DecodeReal_3. The x86_64 slice is upstream's clang x64 build without
        # USE_ASM (var_mac_x64.mak: USE_ASM=, 7zip_gcc.mak:1266-1345): the x86 .asm files are MASM
        # syntax, so every *Opt.c is compiled as C and LzmaDec.c without Z7_LZMA_DEC_OPT. The
        # define only matters to LzmaDec.c (the one file that tests it), so a target-wide
        # per-arch setting replaces the per-file flag, which Xcode cannot make per-arch.
        SZ_LZMA_DEC_OPT_DEFS: ""
        "SZ_LZMA_DEC_OPT_DEFS[arch=arm64]": "Z7_LZMA_DEC_OPT"
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "NDEBUG=1", "_REENTRANT=1", "_FILE_OFFSET_BITS=64", "_LARGEFILE_SOURCE=1", "$(SZ_LZMA_DEC_OPT_DEFS)"]
        GCC_TREAT_WARNINGS_AS_ERRORS: NO
        GCC_WARN_INHIBIT_ALL_WARNINGS: NO
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
        GCC_WARN_64_TO_32_BIT_CONVERSION: NO
        CLANG_WARN_COMMA: NO
        CLANG_WARN_STRICT_PROTOTYPES: NO
        # LzmaDecOpt.S has no __aarch64__ guard: the x86_64 slice excludes it (and has no
        # Z7_LZMA_DEC_OPT, above).
        "EXCLUDED_SOURCE_FILE_NAMES[arch=x86_64]": LzmaDecOpt.S
    sources:
      # Platform layer (macOS implementations of the link-time obligations,
      # 02-engine-api.md section 4.3). Warnings are errors here.
      - path: Core/Platform
        compilerFlags: "-Wall -Wextra -Werror"
      # Agent (archive-as-folder), patched per 02-engine-api.md section 4.2
      - path: ../CPP/7zip/UI/Agent/Agent.cpp
      - path: ../CPP/7zip/UI/Agent/AgentOut.cpp
      - path: ../CPP/7zip/UI/Agent/AgentProxy.cpp
      - path: ../CPP/7zip/UI/Agent/ArchiveFolder.cpp
      - path: ../CPP/7zip/UI/Agent/ArchiveFolderOpen.cpp
      - path: ../CPP/7zip/UI/Agent/ArchiveFolderOut.cpp
      - path: ../CPP/7zip/UI/Agent/UpdateCallbackAgent.cpp
      # Portable UI/Common extras not in 7zz
      - path: ../CPP/7zip/UI/Common/WorkDir.cpp
      - path: ../CPP/7zip/UI/Common/ArchiveName.cpp
      # Portable FileManager helpers (SplitUtils patched; PropertyName/FormatUtils need MyLoadString)
      - path: ../CPP/7zip/UI/FileManager/StringUtils.cpp
      - path: ../CPP/7zip/UI/FileManager/TextPairs.cpp
      - path: ../CPP/7zip/UI/FileManager/SplitUtils.cpp
      - path: ../CPP/7zip/UI/FileManager/PropertyName.cpp
      - path: ../CPP/7zip/UI/FileManager/FormatUtils.cpp
      # Lang file reader
      - path: ../CPP/Common/Lang.cpp
      # ---- exact 7zz set (02-engine-api.md 1.4) minus CPP/7zip/UI/Console ----
