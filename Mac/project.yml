# XcodeGen spec for the macOS 7-Zip port. Regenerate with:  xcodegen -s Mac/project.yml
# Rules and gotchas: Mac/docs/04-toolchain.md section 5, Mac/docs/architecture.md.
# Source paths must stay relative (../C, ../CPP, ../Asm); absolute or deep paths hang XcodeGen.
name: 7-Zip
options:
  bundleIdPrefix: com.yrambler2001
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: NO
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CLANG_CXX_LIBRARY: libc++
    GCC_C_LANGUAGE_STANDARD: gnu17
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: NO
    SKIP_INSTALL: YES
  configs:
    Debug:
      GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "DEBUG=1"]
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
targets:

  # ---------------------------------------------------------------------------
  # SevenZipCore: the unchanged 7-Zip engine (7zz source set minus the console
  # files) + patched UI/Agent + portable UI/Common/FileManager helpers + the
  # macOS platform layer (Mac/Core/Platform). See 02-engine-api.md sections 1
  # and 4. Compiled with the 7zz defines; no -Weverything -Werror on upstream
  # code. Mac/Core/Platform sources are compiled with -Wall -Wextra -Werror.
  # ---------------------------------------------------------------------------
  SevenZipCore:
    type: library.static
    platform: macOS
    settings:
      base:
        PRODUCT_NAME: SevenZipCore
        CLANG_CXX_LANGUAGE_STANDARD: c++11
        GCC_OPTIMIZATION_LEVEL: 2
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "NDEBUG=1", "_REENTRANT=1", "_FILE_OFFSET_BITS=64", "_LARGEFILE_SOURCE=1"]
        GCC_TREAT_WARNINGS_AS_ERRORS: NO
        GCC_WARN_INHIBIT_ALL_WARNINGS: NO
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
        GCC_WARN_64_TO_32_BIT_CONVERSION: NO
        CLANG_WARN_COMMA: NO
        CLANG_WARN_STRICT_PROTOTYPES: NO
        # LzmaDecOpt.S has no __aarch64__ guard: a universal build must exclude it
        # for x86_64 and drop Z7_LZMA_DEC_OPT there (ARCHS is arm64-only for now).
        "EXCLUDED_SOURCE_FILE_NAMES[arch=x86_64]": LzmaDecOpt.S
    sources:
      # Platform layer (macOS implementations of the link-time obligations,
      # 02-engine-api.md section 4.3). Warnings are errors here.
      - path: Core/Platform
        compilerFlags: "-Wall -Wextra -Werror"
      # Agent (archive-as-folder), patched per 02-engine-api.md section 4.2
      - path: ../CPP/7zip/UI/Agent/Agent.cpp
      - path: ../CPP/7zip/UI/Agent/AgentOut.cpp
      - path: ../CPP/7zip/UI/Agent/AgentProxy.cpp
      - path: ../CPP/7zip/UI/Agent/ArchiveFolder.cpp
      - path: ../CPP/7zip/UI/Agent/ArchiveFolderOpen.cpp
      - path: ../CPP/7zip/UI/Agent/ArchiveFolderOut.cpp
      - path: ../CPP/7zip/UI/Agent/UpdateCallbackAgent.cpp
      # Portable UI/Common extras not in 7zz
      - path: ../CPP/7zip/UI/Common/WorkDir.cpp
      - path: ../CPP/7zip/UI/Common/ArchiveName.cpp
      # Portable FileManager helpers (SplitUtils patched; PropertyName/FormatUtils need MyLoadString)
      - path: ../CPP/7zip/UI/FileManager/StringUtils.cpp
      - path: ../CPP/7zip/UI/FileManager/TextPairs.cpp
      - path: ../CPP/7zip/UI/FileManager/SplitUtils.cpp
      - path: ../CPP/7zip/UI/FileManager/PropertyName.cpp
      - path: ../CPP/7zip/UI/FileManager/FormatUtils.cpp
      # Lang file reader
      - path: ../CPP/Common/Lang.cpp
      # ---- exact 7zz set (02-engine-api.md 1.4) minus CPP/7zip/UI/Console ----
      - path: ../Asm/arm64/LzmaDecOpt.S
      - path: ../C/7zBuf2.c
