  # ---------------------------------------------------------------------------
  # SevenZipKit: Objective-C++ bridge framework. Swift sees only Core/include.
  # ---------------------------------------------------------------------------
  SevenZipKit:
    type: framework
    platform: macOS
    sources:
      - path: Core
        headerVisibility: project
        excludes:
          - "Platform/**"
          - "include/**"
          - "Info.plist"
      - path: Core/include
        headerVisibility: public
      - path: Resources/Lang
        type: folder
        buildPhase: resources
    dependencies:
      - target: SevenZipCore
        link: true
      - sdk: Foundation.framework
      - sdk: CoreServices.framework
    settings:
      base:
        PRODUCT_NAME: SevenZipKit
        PRODUCT_BUNDLE_IDENTIFIER: com.yrambler2001.7zip.SevenZipKit
        INFOPLIST_FILE: Core/Info.plist
        DEFINES_MODULE: YES
        MODULEMAP_FILE: ""
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_MODULES: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "NDEBUG=1", "_REENTRANT=1", "_FILE_OFFSET_BITS=64", "_LARGEFILE_SOURCE=1"]
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
        WARNING_CFLAGS: ["-Wall", "-Wextra"]
        # The engine registers formats/codecs from static constructors in
        # *Register.cpp; nothing references those objects, so force-load the
        # whole archive (02-engine-api.md 4.5).
        OTHER_LDFLAGS: ["$(inherited)", "-lc++", "-Wl,-force_load,$(BUILT_PRODUCTS_DIR)/libSevenZipCore.a"]
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/Frameworks"]
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
      # packaging scope: the bridge used to be pinned at -O0 in *every* configuration, so a Release
      # build shipped an unoptimized ObjC++ layer while Swift got -O and the engine -O2. Debug keeps
      # -O0 for debuggability; Release matches SevenZipCore at -O2.
      configs:
        Debug:
          GCC_OPTIMIZATION_LEVEL: 0
        Release:
          GCC_OPTIMIZATION_LEVEL: 2

  # ---------------------------------------------------------------------------
  # 7-Zip: the AppKit app (Swift). Non-sandboxed file manager.
  # ---------------------------------------------------------------------------
  7-Zip:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
      - path: Resources/Assets.xcassets
      # Document-type icons, one .icns per upstream format icon, copied flat into
      # Contents/Resources so CFBundleDocumentTypes/CFBundleTypeIconFile and NSImage(named:)
      # both find them by bare name. Generated by Mac/scripts/make-icons.sh; see
      # ai/api/icons.md.
      - path: Resources/Icons
        buildPhase: resources
      - path: Resources/SFX
        type: folder
        buildPhase: resources
      # opsgaps: the HTML help unpacked from 7-zip.chm by fetch-assets.sh, kept as a folder
      # so Contents/Resources/Help/<kHelpTopic> resolves (01 section 9 #17).
      - path: Resources/Help
        type: folder
        buildPhase: resources
    dependencies:
      - target: SevenZipKit
        embed: true
      - target: FinderSync
        embed: true
      # finder scope: the two Finder Quick Actions (03 section 6.1, section 6.3).
      - target: QuickActionExtract
        embed: true
      - target: QuickActionCompress
        embed: true
    settings:
      base:
        PRODUCT_NAME: 7-Zip
        PRODUCT_MODULE_NAME: SevenZipApp
        PRODUCT_BUNDLE_IDENTIFIER: com.yrambler2001.7zip
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        # dlgfeel (requests.md listfeel -> packaging): the Apple-events entitlement Finder's Get
        # Info needs under the hardened runtime; harmless in the ad-hoc builds.
        CODE_SIGN_ENTITLEMENTS: Resources/App.entitlements

  # ---------------------------------------------------------------------------
  # fastui scope: the test-only app copies (see the SevenZipTestApp template).
  #   7-Zip-Host    hosts SevenZipAppTests, so the app-hosted unit tests run in
  #                 a process no XCUITest shard will terminate.
  #   7-Zip-Probe1  the first read-only XCUITest shard.
  #   7-Zip-Probe2  the second.
  # The input shard drives the real `7-Zip` target, so `run.sh`, the packaging
  # scope and the Finder extension registration are untouched.
  # ---------------------------------------------------------------------------
  7-Zip-Host:
    templates: [SevenZipTestApp]
    templateAttributes:
      productName: 7-Zip-Host
      moduleName: SevenZipAppHost
      bundleId: com.yrambler2001.7zip-host

  7-Zip-Probe1:
    templates: [SevenZipTestApp]
    templateAttributes:
      productName: 7-Zip-Probe1
      moduleName: SevenZipAppProbe1
      bundleId: com.yrambler2001.7zip-p1

  7-Zip-Probe2:
    templates: [SevenZipTestApp]
    templateAttributes:
      productName: 7-Zip-Probe2
      moduleName: SevenZipAppProbe2
      bundleId: com.yrambler2001.7zip-p2

  # ---------------------------------------------------------------------------
  # FinderSync: Finder Sync extension stub (later waves fill the menu).
  # ---------------------------------------------------------------------------
  FinderSync:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderSync
        excludes:
          - "Info.plist"
          - "*.entitlements"
      # finder scope: the pure-Foundation command layer the extension shares with the app, so the
      # menu, the naming rules and the URL transport cannot drift (ai/api/finder.md).
      - path: App/Integration/ArchiveNaming.swift
      - path: App/Integration/ArgumentGrammar.swift
      - path: App/Integration/CommandURL.swift
      - path: App/Integration/FinderMenuModel.swift
      - path: App/Integration/IntegrationSettings.swift
      # finderfix: the aimed hand-off to the containing app and the Quick Action input resolver.
      - path: App/Integration/ExtensionHandoff.swift
      - path: App/Integration/FinderMenuBuilder.swift
      - path: App/Integration/QuickActionInput.swift
    # XcodeGen owns this file: it regenerates it from `properties` on every run, so the keys must
    # live here and Mac/FinderSync/FinderSync.entitlements is a generated artefact.
    #  * app-sandbox: a Finder Sync appex MUST be sandboxed or the system refuses to load it
    #    (03-shell-integration-inventory.md section 6.4, section 7). ENABLE_APP_SANDBOX below is
    #    needed as well: Xcode 15+ drives that one key from the build setting and strips it from the
    #    entitlements file when the setting is NO.
    #  * shared-preference.read-only: lets the sandboxed extension read the five Options.* values of
    #    CContextMenuInfo straight from the app's domain (03 section 1.3); cfprefsd otherwise
    #    redirects every domain into the extension's own container. It does survive the ad-hoc
    #    signature -- but only a *clean* build re-signs the appex, so verify with
    #    `codesign -d --entitlements` after `rm -rf Mac/build`. The snapshot the app pushes into the
    #    extension container is the second path. No App Group: macOS 15+ rejects a group identifier
    #    that is not prefixed by a Team ID.
    entitlements:
      path: FinderSync/FinderSync.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.shared-preference.read-only:
          - com.yrambler2001.7zip
    settings:
      base:
        PRODUCT_NAME: FinderSync
        PRODUCT_MODULE_NAME: SevenZipFinderSync
        PRODUCT_BUNDLE_IDENTIFIER: com.yrambler2001.7zip.FinderSync
        INFOPLIST_FILE: FinderSync/Info.plist
        # Xcode 15+ drives com.apple.security.app-sandbox from this setting and *strips* the key
        # from CODE_SIGN_ENTITLEMENTS when it is NO. A Finder Sync appex must be sandboxed.
        ENABLE_APP_SANDBOX: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        CODE_SIGN_ENTITLEMENTS: FinderSync/FinderSync.entitlements

  # ---------------------------------------------------------------------------
  # finder scope: the two Finder Quick Actions (`com.apple.ui-services` Action extensions with
  # NSExtensionServiceAllowsFinderPreviewItem, 03-shell-integration-inventory.md section 6.1).
  # One appex is one flat Quick Action entry, hence two targets; both share
  # Mac/QuickAction/QuickActionController.swift and differ only in their principal class.
  # ---------------------------------------------------------------------------
  QuickActionExtract:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickAction
        excludes:
          - "Extract/Info.plist"
          - "Compress/Info.plist"
          - "*.entitlements"
      - path: App/Integration/ArchiveNaming.swift
      - path: App/Integration/ArgumentGrammar.swift
      - path: App/Integration/CommandURL.swift
      - path: App/Integration/FinderMenuModel.swift
      - path: App/Integration/IntegrationSettings.swift
      # finderfix: the aimed hand-off to the containing app and the Quick Action input resolver.
      - path: App/Integration/ExtensionHandoff.swift
      - path: App/Integration/QuickActionInput.swift
    # Generated by XcodeGen; see the note on the FinderSync target.
    entitlements:
      path: QuickAction/QuickAction.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.shared-preference.read-only:
          - com.yrambler2001.7zip
    settings:
      base:
        PRODUCT_NAME: QuickActionExtract
        PRODUCT_MODULE_NAME: SevenZipQuickActionExtract
        PRODUCT_BUNDLE_IDENTIFIER: com.yrambler2001.7zip.QuickActionExtract
        INFOPLIST_FILE: QuickAction/Extract/Info.plist
        ENABLE_APP_SANDBOX: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        CODE_SIGN_ENTITLEMENTS: QuickAction/QuickAction.entitlements

  QuickActionCompress:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickAction
        excludes:
          - "Extract/Info.plist"
          - "Compress/Info.plist"
          - "*.entitlements"
      - path: App/Integration/ArchiveNaming.swift
      - path: App/Integration/ArgumentGrammar.swift
      - path: App/Integration/CommandURL.swift
      - path: App/Integration/FinderMenuModel.swift
      - path: App/Integration/IntegrationSettings.swift
      # finderfix: the aimed hand-off to the containing app and the Quick Action input resolver.
      - path: App/Integration/ExtensionHandoff.swift
      - path: App/Integration/QuickActionInput.swift
    # Generated by XcodeGen; see the note on the FinderSync target.
    entitlements:
      path: QuickAction/QuickAction.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.shared-preference.read-only:
          - com.yrambler2001.7zip
    settings:
      base:
        PRODUCT_NAME: QuickActionCompress
        PRODUCT_MODULE_NAME: SevenZipQuickActionCompress
        PRODUCT_BUNDLE_IDENTIFIER: com.yrambler2001.7zip.QuickActionCompress
        INFOPLIST_FILE: QuickAction/Compress/Info.plist
        ENABLE_APP_SANDBOX: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        CODE_SIGN_ENTITLEMENTS: QuickAction/QuickAction.entitlements

  # ---------------------------------------------------------------------------
  # SevenZipKitTests: bridge unit tests (Swift) against Tests/Fixtures.
  # ---------------------------------------------------------------------------
  SevenZipKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SevenZipKitTests
        excludes:
          - "Info.plist"
      # App sources the unit tests exercise directly, compiled into the test bundle instead of
      # being symlinked into Tests/SevenZipKitTests (requests.md: options -> harness, panel ->
      # harness, finder -> packaging). All are Foundation-only by contract, so they build outside
      # the app target unchanged. This is the ONE mechanism: there are no symlinks under
      # Tests/SevenZipKitTests any more, and adding a file here as well as symlinking it would
      # compile it twice into the test bundle.
      - path: App/Support/Settings.swift
      - path: App/Support/FileTypes.swift
      # panel scope: the sort comparator, mask matcher, operated-items rule and column model.
      - path: App/Panel/PanelRow.swift
      - path: App/Panel/PanelLogic.swift
      # compress scope: the Compress dialog's format/level/method model.
      - path: App/Dialogs/CompressModel.swift
      # finder scope: the pure-Foundation command layer (naming, argv grammar, URL transport,
      # menu model, settings snapshot) shared with the two appex targets.
      - path: App/Integration/ArchiveNaming.swift
      - path: App/Integration/ArgumentGrammar.swift
      - path: App/Integration/CommandURL.swift
      - path: App/Integration/FinderMenuModel.swift
      - path: App/Integration/IntegrationSettings.swift
      # finderfix: the aimed hand-off to the containing app and the Quick Action input resolver.
      - path: App/Integration/ExtensionHandoff.swift
      - path: App/Integration/FinderMenuBuilder.swift
      - path: App/Integration/QuickActionInput.swift
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: SevenZipKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yrambler2001.7zip.SevenZipKitTests
        INFOPLIST_FILE: Tests/SevenZipKitTests/Info.plist
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]

  # ---------------------------------------------------------------------------
  # SevenZipAppTests (fastui scope): XCTest cases that run **inside the app's own
  # process** (TEST_HOST), so they get real AppKit objects, real Auto Layout and
  # the real lang files at unit-test speed. This is where the dialog layout
  # sweep, the menu inventory and the 93-language localization sweep live now --
  # see Mac/Tests/AppTests and ai/reports/fastui.md.
  #
  # Build settings that turned out to be necessary, all measured:
  #   TEST_HOST / BUNDLE_LOADER    the app is the host and the linkage target,
  #                               so `@testable import SevenZipApp` resolves.
  #   ENABLE_TESTABILITY (Debug)   already set project-wide; without it the
  #                               internal types of the app module are invisible.
  #   PRODUCT_MODULE_NAME on the app is SevenZipApp, which is the module name the
  #                               test bundle imports (not "7-Zip", which is not
  #                               a valid Swift identifier).
  #   LD_RUNPATH_SEARCH_PATHS with @loader_path/../Frameworks so SevenZipKit.framework,
  #                               embedded in the host app, loads from the test bundle too.
  #   CODE_SIGN_IDENTITY "-"       inherited from the project: the ad-hoc signed host app
  #                               accepts an ad-hoc signed injected bundle.
  # ---------------------------------------------------------------------------
  SevenZipAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AppTests
        excludes:
          - "Info.plist"
      # `TestPaths` is shared with the UI shards: the fixtures, the screenshot directory and the
      # real home directory are found the same way in both.
      - path: Tests/UIDriver/TestPaths.swift
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: 7-Zip-Host
    settings:
      base:
        PRODUCT_NAME: SevenZipAppTests
        PRODUCT_MODULE_NAME: SevenZipAppTests
        PRODUCT_BUNDLE_IDENTIFIER: com.yrambler2001.7zip.AppTests
        INFOPLIST_FILE: Tests/AppTests/Info.plist
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/7-Zip-Host.app/Contents/MacOS/7-Zip-Host"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]

  # ---------------------------------------------------------------------------
  # The three XCUITest shards (see the SevenZipUIShard template).
  #   7-ZipUITests        the input shard: every case here clicks, double-clicks
  #                       or types, so it runs alone -- macOS delivers a
  #                       synthesized event to the frontmost application. It
  #                       drives the real app, which keeps `--only` and the
  #                       existing docs working unchanged.
  #   7-ZipUITestsProbe1  read-only, URL-driven Finder commands.
  #   7-ZipUITestsProbe2  read-only, launch state and the test-support contract.
  # The probes run concurrently with each other and with the two unit-test
  # targets; only the input shard needs the machine to itself.
  # ---------------------------------------------------------------------------
  7-ZipUITests:
    templates: [SevenZipUIShard]
    templateAttributes:
      productName: 7-ZipUITests
      moduleName: SevenZipUITests
      bundleId: com.yrambler2001.7zip.UITests
      casesPath: Tests/UITests
      appTarget: 7-Zip
      appBundleId: com.yrambler2001.7zip
      shardName: input

  7-ZipUITestsProbe1:
    templates: [SevenZipUIShard]
    templateAttributes:
      productName: 7-ZipUITestsProbe1
      moduleName: SevenZipUITestsProbe1
      bundleId: com.yrambler2001.7zip.UITestsProbe1
      casesPath: Tests/UIProbe1
      appTarget: 7-Zip-Probe1
      appBundleId: com.yrambler2001.7zip-p1
      shardName: probe1

  7-ZipUITestsProbe2:
    templates: [SevenZipUIShard]
    templateAttributes:
      productName: 7-ZipUITestsProbe2
      moduleName: SevenZipUITestsProbe2
      bundleId: com.yrambler2001.7zip.UITestsProbe2
      casesPath: Tests/UIProbe2
      appTarget: 7-Zip-Probe2
      appBundleId: com.yrambler2001.7zip-p2
      shardName: probe2

schemes:
  7-Zip:
    build:
      targets:
        7-Zip: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SevenZipKitTests
        - 7-ZipUITests
  SevenZipKitTests:
    build:
      targets:
        SevenZipKitTests: all
    test:
      config: Debug
      targets:
        - SevenZipKitTests
  7-ZipUITests:
    build:
      targets:
        7-ZipUITests: all
        7-Zip: [run, test]
    test:
      config: Debug
      targets:
        - 7-ZipUITests
  # fastui scope: the app-hosted unit tests, on their own copy of the app.
  SevenZipAppTests:
    build:
      targets:
        SevenZipAppTests: all
        7-Zip-Host: [run, test]
    test:
      config: Debug
      # The app-hosted tests run inside a real 7-Zip process, which reads and writes its settings
      # domain -- so it is pointed at a throwaway plist, exactly as every UI test is. The test
      # bundle also calls setenv() before its first case (`AppHostTestCase.isolatedFromRealSettings`)
      # because `NMacPrefs::ApplicationID()` re-reads the variable on every access; this makes the
      # isolation hold from the app's very first read instead of from the first test.
      environmentVariables:
        SEVENZIP_DEFAULTS_SUITE: $(SRCROOT)/build/hostapp-defaults.plist
      targets:
        - SevenZipAppTests
  7-ZipUITestsProbe1:
    build:
      targets:
        7-ZipUITestsProbe1: all
        7-Zip-Probe1: [run, test]
    test:
      config: Debug
      targets:
        - 7-ZipUITestsProbe1
  7-ZipUITestsProbe2:
    build:
      targets:
        7-ZipUITestsProbe2: all
        7-Zip-Probe2: [run, test]
    test:
      config: Debug
      targets:
        - 7-ZipUITestsProbe2
  # fastui scope: every test target in one scheme, so `xcodebuild build-for-testing`
  # produces a single .xctestrun that all the shards can then be run from with
  # `test-without-building` -- no rebuild per shard (Mac/scripts/test.sh --shards).
  7-Zip-AllTests:
    build:
      targets:
        SevenZipKitTests: [test]
        SevenZipAppTests: [test]
        7-ZipUITests: [test]
        7-ZipUITestsProbe1: [test]
        7-ZipUITestsProbe2: [test]
        7-Zip: [run, test]
        7-Zip-Host: [run, test]
        7-Zip-Probe1: [run, test]
        7-Zip-Probe2: [run, test]
    test:
      config: Debug
      environmentVariables:
        SEVENZIP_DEFAULTS_SUITE: $(SRCROOT)/build/hostapp-defaults.plist
      targets:
        - SevenZipKitTests
        - SevenZipAppTests
        - 7-ZipUITests
        - 7-ZipUITestsProbe1
        - 7-ZipUITestsProbe2
