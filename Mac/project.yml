  # ---------------------------------------------------------------------------
  # SevenZipKit: Objective-C++ bridge framework. Swift sees only Core/include.
  # ---------------------------------------------------------------------------
  SevenZipKit:
    type: framework
    platform: macOS
    sources:
      - path: Core
        headerVisibility: project
        excludes:
          - "Platform/**"
          - "include/**"
          - "Info.plist"
      - path: Core/include
        headerVisibility: public
      - path: Resources/Lang
        type: folder
        buildPhase: resources
    dependencies:
      - target: SevenZipCore
        link: true
      - sdk: Foundation.framework
      - sdk: CoreServices.framework
    settings:
      base:
        PRODUCT_NAME: SevenZipKit
        PRODUCT_BUNDLE_IDENTIFIER: com.yrambler2001.7zip.SevenZipKit
        INFOPLIST_FILE: Core/Info.plist
        DEFINES_MODULE: YES
        MODULEMAP_FILE: ""
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_MODULES: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_OPTIMIZATION_LEVEL: 0
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "NDEBUG=1", "_REENTRANT=1", "_FILE_OFFSET_BITS=64", "_LARGEFILE_SOURCE=1"]
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
        WARNING_CFLAGS: ["-Wall", "-Wextra"]
        # The engine registers formats/codecs from static constructors in
        # *Register.cpp; nothing references those objects, so force-load the
        # whole archive (02-engine-api.md 4.5).
        OTHER_LDFLAGS: ["$(inherited)", "-lc++", "-Wl,-force_load,$(BUILT_PRODUCTS_DIR)/libSevenZipCore.a"]
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/Frameworks"]
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES

  # ---------------------------------------------------------------------------
  # 7-Zip: the AppKit app (Swift). Non-sandboxed file manager.
  # ---------------------------------------------------------------------------
  7-Zip:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
      - path: Resources/Assets.xcassets
      # Document-type icons, one .icns per upstream format icon, copied flat into
      # Contents/Resources so CFBundleDocumentTypes/CFBundleTypeIconFile and NSImage(named:)
      # both find them by bare name. Generated by Mac/scripts/make-icons.sh; see
      # Mac/docs/api/icons.md.
      - path: Resources/Icons
        buildPhase: resources
      - path: Resources/SFX
        type: folder
        buildPhase: resources
    dependencies:
      - target: SevenZipKit
        embed: true
      - target: FinderSync
        embed: true
    settings:
      base:
        PRODUCT_NAME: 7-Zip
        PRODUCT_MODULE_NAME: SevenZipApp
        PRODUCT_BUNDLE_IDENTIFIER: com.yrambler2001.7zip
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES

  # ---------------------------------------------------------------------------
  # FinderSync: Finder Sync extension stub (later waves fill the menu).
  # ---------------------------------------------------------------------------
  FinderSync:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderSync
        excludes:
          - "Info.plist"
          - "*.entitlements"
    entitlements:
      path: FinderSync/FinderSync.entitlements
    settings:
      base:
        PRODUCT_NAME: FinderSync
        PRODUCT_MODULE_NAME: SevenZipFinderSync
        PRODUCT_BUNDLE_IDENTIFIER: com.yrambler2001.7zip.FinderSync
        INFOPLIST_FILE: FinderSync/Info.plist
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        CODE_SIGN_ENTITLEMENTS: FinderSync/FinderSync.entitlements

  # ---------------------------------------------------------------------------
  # SevenZipKitTests: bridge unit tests (Swift) against Tests/Fixtures.
  # ---------------------------------------------------------------------------
  SevenZipKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SevenZipKitTests
        excludes:
          - "Info.plist"
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: SevenZipKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yrambler2001.7zip.SevenZipKitTests
        INFOPLIST_FILE: Tests/SevenZipKitTests/Info.plist
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]

  # ---------------------------------------------------------------------------
  # 7-ZipUITests: XCUITest bundle driving the 7-Zip app (harness scope).
  # Runs in the generated 7-ZipUITests-Runner.app; TEST_TARGET_NAME names the app
  # under test so XCUIApplication() picks it up with no bundle id. The Fixtures
  # folder is copied into the bundle so tests find archives without the repo.
  # ---------------------------------------------------------------------------
  7-ZipUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UITests
        excludes:
          - "Info.plist"
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: 7-Zip
    settings:
      base:
        PRODUCT_NAME: 7-ZipUITests
        PRODUCT_MODULE_NAME: SevenZipUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.yrambler2001.7zip.UITests
        INFOPLIST_FILE: Tests/UITests/Info.plist
        TEST_TARGET_NAME: 7-Zip
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        # No entitlements file: Xcode signs the generated 7-ZipUITests-Runner.app with its own
        # (app-sandboxed) entitlements and ignores CODE_SIGN_ENTITLEMENTS here -- verified, see
        # Mac/docs/reports/harness.md section 1.
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/../Frameworks"]

schemes:
  7-Zip:
    build:
      targets:
        7-Zip: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SevenZipKitTests
        - 7-ZipUITests
  SevenZipKitTests:
    build:
      targets:
        SevenZipKitTests: all
    test:
      config: Debug
      targets:
        - SevenZipKitTests
  7-ZipUITests:
    build:
      targets:
        7-ZipUITests: all
        7-Zip: [run, test]
    test:
      config: Debug
      targets:
        - 7-ZipUITests
